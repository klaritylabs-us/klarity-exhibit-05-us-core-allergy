[package]
name = "klarity-exhibit-05-us-core-allergy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "US Core AllergyIntolerance checks for FHIR R4"
publish = false

[lib]
name = "us_core_allergy"
path = "src/lib.rs"

[[bin]]
name = "validate-allergy"
path = "src/bin/validate_allergy.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
